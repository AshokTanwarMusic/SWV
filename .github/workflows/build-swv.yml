name: Build SWV 32-bit APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build SWV production release
        run: ./gradlew :app:assembleProdRelease --no-daemon --stacktrace

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > swv-release.jks
          ls -lh swv-release.jks

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found"
            exit 1
          fi

          echo "Found APK: $APK"

          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          "$ZIPALIGN" -f -p 4 "$APK" artifacts-aligned.apk

          "$APKSIGNER" sign \
            --ks swv-release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out artifacts/SWV-1.5-32bit.apk \
            artifacts-aligned.apk

          "$APKSIGNER" verify --verbose artifacts/SWV-1.5-32bit.apk

          echo "SIGNED APK CREATED SUCCESSFULLY"
          ls -lh artifacts/SWV-1.5-32bit.apk

      - name: Clean signing files
        if: always()
        run: |
          rm -f swv-release.jks
          rm -f artifacts-aligned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SWV-1.5-32bit-SIGNED
          path: artifacts/SWV-1.5-32bit.apk
          if-no-files-found: error
