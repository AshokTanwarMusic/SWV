name: Build SWV 32-bit APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build SWV production release
        run: ./gradlew :app:assembleProdRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -type f -name '*.apk' -print -exec cp {} artifacts/SWV-1.5-32bit.apk \;
          test -s artifacts/SWV-1.5-32bit.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SWV-1.5-32bit
          path: artifacts/SWV-1.5-32bit.apk
          if-no-files-found: error
